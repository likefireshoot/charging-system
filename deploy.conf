#!/bin/bash
# ============================================================
# 部署 / 回滚 共用配置文件
# bushu.sh（部署）与 rollback.sh（回滚）都会 source 本文件，
# 修改服务器地址、端口、部署目录时，只需改这一处。
# ============================================================

# 远程服务器信息
REMOTE_HOST="36.133.145.111"      # 服务器地址
REMOTE_USER="root"                # SSH 用户名
REMOTE_PORT="34543"               # SSH 端口

# 单目录部署：92/93 两个端口由 Nginx 共用同一个 root 目录
# 前端通过 window.location.port 自动区分菜单，因此只需部署一份 dist
# ⚠️ 请确保服务器 Nginx 的 92、93 两个 server 块（或 listen 两个端口的单一块）
#    其 root 都指向下面这个目录，例如：root /home/jingzhou/frontend/html/shoufei;
REMOTE_BASE_DIR="/home/jingzhou/frontend/html/shoufei"   # 单目录：92/93 共用

TARGET_DIR_NAME="dist"             # 要替换的目录名
ZIP_FILE_NAME="dist.zip"           # 压缩包文件名
